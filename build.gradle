plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "jm-seedmap-${project.minecraft_version}"
}

loom {
	runs {
		client {
			// ./gradlew runClient -Pselftest : join run/saves/selftest and compare predictions with vanilla.
			if (project.hasProperty("selftest")) {
				vmArg "-Djm_seedmap.selftest=true"
				vmArg "-Djm_seedmap.selftest.screenshot=true"
				vmArg "-Djm_seedmap.selftest.quit=true"
				vmArg "-Djm_seedmap.selftest.slime=true"
				if (project.hasProperty("seed")) {
					vmArg "-Djm_seedmap.selftest.seed=${project.property('seed')}"
				}
				if (project.hasProperty("mp")) {
					programArgs "--quickPlayMultiplayer", "localhost:25599"
				} else {
					programArgs "--quickPlaySingleplayer", "selftest"
				}
			}
		}
	}
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

// Some APIs we compile against only ship nested inside the mod jars (Jar-in-Jar): pull them out.
configurations {
	nestedApiSources {
		transitive = false
	}
}

def nestedApiDir = layout.buildDirectory.dir("nested-apis")
def extractNestedApis = tasks.register("extractNestedApis", Sync) {
	from({ configurations.nestedApiSources.collect { zipTree(it) } }) {
		include "META-INF/jars/xaerolib-*.jar", "META-INF/jars/journeymap-api-*.jar"
		eachFile { path = name }
	}
	includeEmptyDirs = false
	into nestedApiDir
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Map mods are optional: compiled against, loaded at runtime only when present.
	// Dev client: -Pmaps=jm|xaero|both (default both).
	def journeymap = "maven.modrinth:journeymap:${project.journeymap_version}"
	def xaeroMinimap = "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
	def xaeroWorldMap = "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"
	nestedApiSources journeymap
	nestedApiSources xaeroMinimap
	compileOnly(xaeroMinimap) { transitive = false }
	compileOnly(xaeroWorldMap) { transitive = false }
	compileOnly fileTree(dir: nestedApiDir, include: "*.jar").builtBy(extractNestedApis)
	compileOnly("maven.modrinth:modmenu:${project.modmenu_version}") { transitive = false }

	def maps = project.findProperty("maps") ?: "both"
	if (maps == "jm" || maps == "both") {
		localRuntime(journeymap) { transitive = false }
	}
	if (maps == "xaero" || maps == "both") {
		localRuntime(xaeroMinimap) { transitive = false }
		localRuntime(xaeroWorldMap) { transitive = false }
	}
	// Compatibility testing: ./gradlew runClient -Pmodernfix
	if (project.hasProperty("modernfix")) {
		localRuntime("maven.modrinth:modernfix-mvus:5.27.19-build.2") { transitive = false }
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
