plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = "jm-seedmap-${project.minecraft_version}"
}

loom {
	runs {
		client {
			// ./gradlew runClient -Pselftest : join run/saves/selftest and compare predictions with vanilla.
			if (project.hasProperty("selftest")) {
				vmArg "-Djm_seedmap.selftest=true"
				vmArg "-Djm_seedmap.selftest.screenshot=true"
				vmArg "-Djm_seedmap.selftest.quit=true"
				vmArg "-Djm_seedmap.selftest.slime=true"
				if (project.hasProperty("quick")) {
					vmArg "-Djm_seedmap.selftest.quick=true"
				}
				if (project.hasProperty("seed")) {
					vmArg "-Djm_seedmap.selftest.seed=${project.property('seed')}"
				}
				if (project.hasProperty("mp")) {
					programArgs "--quickPlayMultiplayer", "localhost:25599"
				} else {
					// -Pworld=selftest-dp: the world with test data packs (see testdata/datapacks).
					programArgs "--quickPlaySingleplayer", project.findProperty("world") ?: "selftest"
				}
			}
		}
	}
}

repositories {
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}
}

// Some APIs we compile against only ship nested inside the mod jars (Jar-in-Jar): pull them out.
configurations {
	nestedApiSources {
		transitive = false
	}
}

def nestedApiDir = layout.buildDirectory.dir("nested-apis")
def extractNestedApis = tasks.register("extractNestedApis", Sync) {
	from({ configurations.nestedApiSources.collect { zipTree(it) } }) {
		include "META-INF/jars/xaerolib-*.jar", "META-INF/jars/journeymap-api-*.jar"
		eachFile { path = name }
	}
	includeEmptyDirs = false
	into nestedApiDir
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Map mods are optional: compiled against, loaded at runtime only when present.
	// Dev client: -Pmaps=jm|xaero|both (default both).
	def journeymap = "maven.modrinth:journeymap:${project.journeymap_version}"
	def xaeroMinimap = "maven.modrinth:xaeros-minimap:${project.xaero_minimap_version}"
	def xaeroWorldMap = "maven.modrinth:xaeros-world-map:${project.xaero_worldmap_version}"
	nestedApiSources journeymap
	nestedApiSources xaeroMinimap
	compileOnly(xaeroMinimap) { transitive = false }
	compileOnly(xaeroWorldMap) { transitive = false }
	compileOnly fileTree(dir: nestedApiDir, include: "*.jar").builtBy(extractNestedApis)
	compileOnly("maven.modrinth:modmenu:${project.modmenu_version}") { transitive = false }

	def maps = project.findProperty("maps") ?: "both"
	if (maps == "jm" || maps == "both") {
		localRuntime(journeymap) { transitive = false }
	}
	if (maps == "xaero" || maps == "both") {
		localRuntime(xaeroMinimap) { transitive = false }
		localRuntime(xaeroWorldMap) { transitive = false }
	}
	// Compatibility testing: ./gradlew runClient -Pextra=modernfix,c2me,lithium (any of the names below).
	def extraMods = [
		modernfix    : "maven.modrinth:modernfix-mvus:5.27.19-build.2",
		c2me         : "maven.modrinth:c2me-fabric:0.4.2-alpha.0.56+26.2",
		lithium      : "maven.modrinth:lithium:mc26.2-0.25.3-fabric",
		moonrise     : "maven.modrinth:moonrise-opt:1.1.2+151ce65",
		scalablelux  : "maven.modrinth:scalablelux:0.3.0-alpha.0.3+26.2",
		ferritecore  : "maven.modrinth:ferrite-core:9.0.0-fabric",
		viafabricplus: "maven.modrinth:viafabricplus:5.0.2",
	]
	def extra = (project.findProperty("extra") ?: "").toString().split(",").findAll { it }
	if (project.hasProperty("modernfix")) {
		extra += "modernfix"
	}
	extra.each { name ->
		if (name == "seedcracker") {
			// Not on Modrinth: put seedcrackerX-<version>.jar from its GitHub releases into libs/.
			localRuntime fileTree(dir: "libs", include: "seedcrackerX-*.jar")
		} else {
			localRuntime(extraMods[name] ?: { throw new GradleException("Unknown extra mod: " + name) }()) { transitive = false }
		}
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}
